<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Símbolo Sanwey: círculo vermelho com 5 listras brancas horizontais
       agrupadas na faixa central-baixa do círculo. -->
  <defs>
    <clipPath id="sanweyCircle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#CC2936"/>
  <g fill="#FFFFFF" clip-path="url(#sanweyCircle)">
    <rect x="0" y="52" width="100" height="2.6"/>
    <rect x="0" y="58" width="100" height="2.6"/>
    <rect x="0" y="64" width="100" height="2.6"/>
    <rect x="0" y="70" width="100" height="2.6"/>
    <rect x="0" y="76" width="100" height="2.6"/>
  </g>
</svg>

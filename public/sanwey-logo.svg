<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Símbolo Sanwey: círculo vermelho com 7 listras horizontais brancas
       distribuídas na metade inferior, clipadas ao contorno do círculo. -->
  <defs>
    <clipPath id="sanweyCircle">
      <circle cx="50" cy="50" r="48"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="48" fill="#CC2936"/>
  <g fill="#FFFFFF" clip-path="url(#sanweyCircle)">
    <rect x="0" y="44" width="100" height="2.2"/>
    <rect x="0" y="51" width="100" height="2.6"/>
    <rect x="0" y="58" width="100" height="2.8"/>
    <rect x="0" y="65" width="100" height="3.0"/>
    <rect x="0" y="72" width="100" height="3.2"/>
    <rect x="0" y="80" width="100" height="3.4"/>
    <rect x="0" y="88" width="100" height="3.4"/>
  </g>
</svg>

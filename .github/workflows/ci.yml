# Gate de entrada: roda a conferência de consistência e o build em todo PR e
# em todo push pra main. Até 28/08/2026 o build só era validado no Netlify —
# ou seja, no caminho de DEPLOY, depois do merge. Aqui ele passa a ser
# checado antes, que é o ponto do "gate de entrada".
#
# `npm run build` já dispara o prebuild (check-consistencia.mjs), então os
# dois gates rodam num passo só. O check tem uma linha de base
# (scripts/consistencia-baseline.json): só reprova violação NOVA.

name: CI — consistência e build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      forcar_rls:
        description: "Rodar a matriz de RLS mesmo sem mudança em migrations (use pra testar o secret)"
        type: boolean
        default: false

jobs:
  verificar:
    name: Consistência + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Roda separado do build pra que a saída do check apareça sozinha no
      # log quando ele é a causa da falha — dentro do prebuild a mensagem
      # fica misturada com a do vite.
      - name: Conferência de consistência
        run: node scripts/check-consistencia.mjs

      - name: Build de produção
        run: npx vite build

  rls:
    name: Matriz de RLS de etapas
    runs-on: ubuntu-latest
    # Roda quando muda migration (o gatilho da classe de bug que este teste
    # existe pra pegar: allowlist de (role, domain) desatualizada quando um
    # board novo nasce), quando muda o proprio teste, ou quando muda este
    # workflow.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    # NAO-BLOQUEANTE por ora (30/08/2026). Na primeira execucao real, este job
    # provou o CONTRARIO do que prometia: o repositorio NAO reconstroi o banco
    # do zero, por dois motivos independentes.
    #
    #   1. Onze migrations sao PULADAS em silencio pela CLI, que exige o
    #      formato <timestamp>_nome.sql. Elas tem uma letra colada na data
    #      (20260807b_, 20260817b_, 20260828b_, 20260902b/c/d_ ...). Estao
    #      aplicadas em producao, mas com outro nome: a 20260828b_agencia_
    #      escopo... esta la como versao 20260828150215. Ou seja, foram
    #      aplicadas direto no banco e o arquivo no Git e uma copia com nome
    #      que a CLI nao reconhece. `supabase db push` tambem as ignoraria.
    #
    #   2. A primeira migration ja quebra: 20260504_add_client_classification
    #      faz ALTER TABLE public.leads num banco onde `leads` nao existe.
    #      Nunca houve no repositorio uma migration que CRIA as tabelas base
    #      — o banco foi montado antes de alguem comecar a versionar.
    #
    # Isso e a causa raiz do bug critico do Onboarding de 28/08: a funcao de
    # trigger rh_onboarding_tarefas_guard_self_update() que so existia em
    # producao nao era descuido isolado, e o sintoma de um repositorio que
    # nunca foi a fonte de verdade do schema.
    #
    # Deixar o job bloqueante hoje deixaria vermelho todo PR com migration,
    # para sempre, por configuracao e nao por codigo — e um gate que sempre
    # falha vira ruido que todo mundo aprende a ignorar. Entao ele roda,
    # aparece no log, e nao trava o merge.
    #
    # PARA REMOVER ESTA LINHA: gerar um baseline do schema de producao
    # (`supabase db dump`) como primeira migration e renomear as 11 com nome
    # invalido. Ver "Pendencia aberta" em docs/handoff-gate-de-qualidade.md.
    continue-on-error: true
    steps:
      # fetch-depth: 0 porque o passo abaixo compara com a base via `...`,
      # que precisa do merge-base — um clone raso nao tem.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ver se vale rodar a matriz
        id: mudou
        run: |
          if [ "${{ inputs.forcar_rls }}" = "true" ]; then
            echo "forçado pelo disparo manual"
            echo "sim=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin ${{ github.base_ref || 'main' }} --depth=1 || true
          if git diff --name-only FETCH_HEAD...HEAD -- supabase/migrations supabase/tests .github/workflows/ci.yml | grep -q .; then
            echo "sim=true" >> "$GITHUB_OUTPUT"
          else
            echo "sim=false" >> "$GITHUB_OUTPUT"
          fi

      # Ate 30/08/2026 este job dependia de um banco na NUVEM, via o secret
      # RLS_TEST_DATABASE_URL apontando pra um branch do Supabase. Isso tinha
      # dois problemas: o branch custava dinheiro parado (foi deletado por
      # isso, e o secret virou orfao — o pooler passou a responder "tenant
      # nao encontrado", quebrando todo PR com migration), e sem o secret o
      # teste passava em branco, ou seja ficava ligado e inerte.
      #
      # Custava US$ 0,01344/hora parado — barato, mas nao se justifica pra um
      # bug que aparece quando nasce um board novo, talvez uma vez por mes.
      # Por isso o branch foi apagado (decisao do Daniel, 28/08/2026). A
      # conclusao daquela sessao foi deixar o job de pe e inerte, rodando o
      # teste a mao; em 30/08/2026 ela foi SUBSTITUIDA por esta, que entrega
      # o mesmo custo zero sem abrir mao da automacao — e sem depender de
      # alguem lembrar de rodar.
      #
      # Agora o banco sobe DENTRO do runner: Docker ja vem instalado nos
      # runners do GitHub, entao a stack local do Supabase (Postgres + auth,
      # com os papeis anon/authenticated/service_role e o schema auth que o
      # teste precisa pra impersonar) custa zero e morre junto com o job.
      # Efeito colateral bom: `supabase start` aplica as 292 migrations do
      # zero, entao o job tambem passa a provar que o repositorio consegue
      # reconstruir o banco sozinho.
      - name: Instalar a CLI do Supabase
        if: steps.mudou.outputs.sim == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Subir o Supabase local (aplica as migrations do zero)
        if: steps.mudou.outputs.sim == 'true'
        run: supabase start

      # O script termina com RAISE EXCEPTION se achar divergencia — ou seja,
      # ja sai com codigo != 0 sozinho.
      - name: Rodar a matriz de RLS
        if: steps.mudou.outputs.sim == 'true'
        run: |
          psql --version >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          if [ -z "$DB_URL" ]; then
            echo "::error::supabase status nao devolveu DB_URL — a stack local nao subiu."
            supabase status || true
            exit 1
          fi
          psql "$DB_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rls_stage_matrix.sql

      - name: Derrubar o Supabase local
        if: always() && steps.mudou.outputs.sim == 'true'
        run: supabase stop --no-backup || true
